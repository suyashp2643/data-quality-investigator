[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-investigator"
version = "0.1.0"
description = "Evidence-driven data quality investigations with constrained model tools"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["dqagent*"]
